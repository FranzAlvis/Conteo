server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de acta subidas por los transcriptores (backend permite hasta
    # 5MB por defecto; se deja margen para no chocar con el límite de nginx).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml;

    # WebSocket de Socket.IO (resultados y estado de mesas en vivo)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Fotos de actas ya subidas (servidas como estáticos por el backend)
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
    }

    # API REST del backend. El prefijo /api/ se descarta al reenviar
    # (proxy_pass con path final "/"), las rutas del backend no lo llevan.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier otra ruta (/, /mesas, /resultados, etc.) sirve
    # index.html y el router del lado del cliente resuelve la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
